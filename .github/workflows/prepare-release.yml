name: Prepare a release
# Run from the Actions tab (by a person, or by Claude) with the new version and a summary. It runs
# scripts/prepare-release.mjs on develop and commits `chore(release): prepare X.Y.Z` straight to develop, as the
# release GitHub App, which starts Open the release pull request. The bump is mechanical, and the release pull request
# into main runs CI on it and shows it for approval, so it gets no pull request of its own.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The new version, such as 0.8.0 (a minor for anything added or changed, a patch for fixes only)
        required: true
      summary:
        description: What the release is about, in a sentence or two, for CHANGELOG.md
        required: true
permissions:
  contents: read
concurrency:
  group: prepare-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-latest
    # The release app's key lives in this environment, which admits only main and develop, so a workflow on any other
    # branch can't read it (docs/repo-settings.md).
    environment: release-app
    steps:
      - name: Check for the release app
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::The release app isn't set up (RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY). Prepare the release by hand as docs/releasing.md says."
            exit 1
          fi
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          token: ${{ steps.token.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - name: Prepare the release
        env:
          VERSION: ${{ inputs.version }}
          SUMMARY: ${{ inputs.summary }}
        run: node scripts/prepare-release.mjs "$VERSION" "$SUMMARY"
      - name: Commit to develop
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ inputs.version }}
          SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          id=$(gh api "users/$SLUG%5Bbot%5D" --jq .id)
          git config user.name "$SLUG[bot]"
          git config user.email "$id+$SLUG[bot]@users.noreply.github.com"
          git commit -am "chore(release): prepare $VERSION"
          git push origin HEAD:develop
          echo "Committed chore(release): prepare $VERSION to develop. Open the release pull request runs next." >> "$GITHUB_STEP_SUMMARY"
