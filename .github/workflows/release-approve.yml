name: Approve the release
# The one click in a release. When CI passes on the open `release: X.Y.Z` pull request (develop → main), this asks for
# approval through the `release` environment, whose required reviewer is Bertram: GitHub emails him and shows "Review
# deployments" on this run. Approving merges the pull request with a merge commit, as the release app; Tag the release
# then tags main and Deploy publishes. Rejecting, or a newer push to develop, leaves the pull request open.
#
# It runs from main's copy of this file whenever CI finishes, so it only acts on a passing pull request from develop
# into main. The merge names the commit CI passed on, so a push after the approval request makes the merge fail
# instead of releasing untested code; the new push's CI asks again.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
  pull-requests: read
defaults:
  run:
    shell: bash
jobs:
  find:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'develop' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      title: ${{ steps.pr.outputs.title }}
    steps:
      - name: Find the release pull request CI passed on
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head develop --state open \
            --json number,title,headRefOid --jq "[.[] | select(.headRefOid == \"$SHA\")][0] // empty")
          if [ -z "$pr" ]; then
            echo "::notice title=Nothing to approve::No open develop → main pull request is at ${SHA::7}."
            exit 0
          fi
          number=$(jq -r .number <<< "$pr")
          title=$(jq -r .title <<< "$pr")
          printf 'number=%s\ntitle=%s\n' "$number" "$title" >> "$GITHUB_OUTPUT"
          echo "### Approve to merge #$number, $title" >> "$GITHUB_STEP_SUMMARY"
  merge:
    needs: find
    if: needs.find.outputs.number
    runs-on: ubuntu-latest
    # A newer passing commit on the same pull request replaces a request still waiting. The group is the job's, not the
    # workflow's, because every CI run starts this workflow and most stop at `find`.
    concurrency:
      group: release-approve-${{ needs.find.outputs.number }}
      cancel-in-progress: true
    # The approval: the environment's required reviewer approves this job before it starts.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/pull/${{ needs.find.outputs.number }}
    steps:
      # A job that names an environment which doesn't exist creates it with no reviewers and runs at once, so this one
      # fails closed unless `release` really asked someone.
      - name: Check the release environment requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length') || reviewers=0
          if [ "$reviewers" -lt 1 ]; then
            echo "::error::The release environment has no required reviewer, so nothing approved this. Set it up as docs/releasing.md says; the pull request stays open."
            exit 1
          fi
      - name: Check for the release app
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::The release app isn't set up (RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY), so the release pull request can't be merged from here. Merge it by hand with a merge commit."
            exit 1
          fi
      # The merge has to come from the app: a push to main made with the workflow's own token runs no CI, so Tag the
      # release would never see `check` pass.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Merge the release pull request
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NUMBER: ${{ needs.find.outputs.number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh pr merge "$NUMBER" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$SHA"
          echo "Merged #$NUMBER. Tag the release tags main once CI passes there, and Deploy follows." >> "$GITHUB_STEP_SUMMARY"
