name: Deploy to Cloudflare
# A v* tag publishes its registry to r/<tag> in R2, once and for good, and deploys the site when it's the highest final
# release. A push to main publishes r/next and uploads a preview version, while it's still main's head. A re-run of an
# older run can publish its own release but never moves production or r/next backwards.
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  actions: read
  contents: read
  checks: read
# One queue per ref type, never cancelled: a tag run waits behind another tag run, and a main push can't replace a
# pending tag run. A newer tag can still replace a pending older one; re-running that one publishes its release.
concurrency:
  group: deploy-${{ github.ref_type }}
  cancel-in-progress: false
# An explicit bash runs every step with -eo pipefail; the implicit default is bash -e, which lets a failed gh in the tag
# lookup's pipeline pass as an empty result.
defaults:
  run:
    shell: bash
jobs:
  deploy:
    runs-on: ubuntu-latest
    # The secrets are the environment's. It admits main, v* tags and develop, whose deploy-preview.yml deploys the
    # preview Worker and checks the R2 keys by writing ci/credentials-check.
    environment: cloudflare
    # What the production smoke test checks the live site against, set only when this run deployed it.
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      entry: ${{ steps.built.outputs.entry }}
      registry: ${{ steps.built.outputs.registry }}
      llms: ${{ steps.built.outputs.llms }}
    # Two credentials, each with only what its steps need. CLOUDFLARE_API_TOKEN deploys the Worker and uploads preview
    # versions, through wrangler, and needs no R2 access. R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY are an R2 API
    # token's keys, Object Read & Write on the lede-design bucket alone, which publish-r2.mjs uses for the registries.
    # CLOUDFLARE_ACCOUNT_ID goes to both.
    steps:
      - name: Check for a Cloudflare token
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_KEYS: ${{ secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            # Stop before the build rather than after it: every run that has the token publishes to R2.
            if [ "$R2_KEYS" != true ]; then
              echo "::error::R2_ACCESS_KEY_ID or R2_SECRET_ACCESS_KEY isn't set in the cloudflare environment, so nothing can be published to R2. docs/releasing.md's Cloudflare credentials says how to add them."
              exit 1
            fi
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN isn't set, so nothing was published or deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version."
            exit 1
          fi
      # A release is immutable once published, so a tag publishes only a commit whose CI `check` passed. The tag usually
      # follows a merge, and `check` appears only once the jobs it needs finish, so a missing or running one is waited
      # for, up to 45 minutes. Only GitHub Actions' own `check` counts, and only its latest run.
      - name: Check CI passed on the tagged commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-parse HEAD)
          for _ in $(seq 90); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit/check-runs?check_name=check&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | max_by(.started_at) // {} | "\(.status // "missing") \(.conclusion // "")"')
            read -r status conclusion <<< "$run"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && exit 0
              echo "::error::CI's check on ${commit::7} finished as $conclusion, so $GITHUB_REF_NAME isn't published. Fix main and tag a new commit."
              exit 1
            fi
            sleep 30
          done
          echo "::error::CI's check on ${commit::7} is ${status/missing/not there}, so $GITHUB_REF_NAME isn't published. Tag a commit on main once CI has passed on it."
          exit 1
      # A tag always publishes its release, and deploys only as the highest final (no "-") v* tag. A main run publishes
      # only while its commit is still main's head.
      - name: Decide what this run publishes
        id: plan
        if: steps.credentials.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          final='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            deploy=false
            if ! [[ "$GITHUB_REF_NAME" =~ $final ]]; then
              echo "::notice title=Not deployed::$GITHUB_REF_NAME is a prerelease. This run publishes r/$GITHUB_REF_NAME and doesn't deploy the site."
            else
              latest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' |
                sed 's#^refs/tags/##' | { grep -E "$final" || true; } | sort -V | tail -n 1)
              if [ "$GITHUB_REF_NAME" = "$latest" ]; then
                deploy=true
              else
                echo "::notice title=Not deployed::$GITHUB_REF_NAME isn't the highest release ($latest). This run publishes r/$GITHUB_REF_NAME and doesn't deploy the site."
              fi
            fi
            printf 'publish=true\ndeploy=%s\n' "$deploy" >> "$GITHUB_OUTPUT"
          else
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
            if [ "$GITHUB_SHA" = "$head" ]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice title=Skipped::$GITHUB_REF_NAME has moved on to ${head::7}, so this run of ${GITHUB_SHA::7} doesn't publish r/next or a preview."
            fi
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.plan.outputs.publish == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.plan.outputs.publish == 'true'
        run: npm ci
      - if: steps.plan.outputs.publish == 'true'
        run: npm run build

      # Exit 3 means r/<tag> is already published, as on a re-run. The release stays as it was first published.
      - name: Publish the release registry to R2
        if: steps.plan.outputs.publish == 'true' && github.ref_type == 'tag'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/publish-r2.mjs public/r "r/$GITHUB_REF_NAME" --remote --immutable || {
            status=$?
            [ "$status" -eq 3 ] || exit "$status"
            echo "::warning::r/$GITHUB_REF_NAME was already in R2 and was left as it was."
          }
      - name: Record what this build serves
        id: built
        if: steps.plan.outputs.deploy == 'true'
        run: bash smoke/build-facts.sh | tee -a "$GITHUB_OUTPUT"
      - name: Deploy
        id: deploy
        if: steps.plan.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --message "$GITHUB_REF_NAME"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the next registry to R2
        if: steps.plan.outputs.publish == 'true' && github.ref_type == 'branch'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-r2.mjs public/r r/next --remote
      - name: Upload a preview version
        if: steps.plan.outputs.publish == 'true' && github.ref_type == 'branch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          npx wrangler versions upload --message "$GITHUB_SHA"
          url=$(jq -r 'select(.type == "version-upload") | .preview_url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          {
            echo "### Preview of ${GITHUB_SHA::7}"
            echo
            echo "${url:-Wrangler reported no preview URL.}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Reads production back once it serves the release, with the same smoke tests the preview passed before approval
  # (smoke/), and compares screenshots of key pages with the ones the preview recorded for the released commit. A
  # failure here doesn't undo the deploy: it says production differs from what was approved, and the run's
  # smoke-results artifact holds the diffs. It needs no secrets, so "Re-run failed jobs" retries it alone.
  smoke:
    name: Smoke-test production
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    steps:
      # The release is a merge of develop into main, so its second parent is the develop commit the preview showed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, persist-credentials: false }
      - name: Find the preview's screenshots of the released commit
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          develop=$(git rev-parse -q --verify 'HEAD^2' || true)
          run=''
          if [ -n "$develop" ]; then
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-preview.yml/runs?branch=develop&head_sha=$develop" --jq '.workflow_runs[].id'); do
              smoke=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                --jq '[.jobs[] | select(.name == "Smoke-test the preview")][0].conclusion // ""')
              if [ "$smoke" = success ]; then run=$id; break; fi
            done
          fi
          if [ -z "$run" ]; then
            echo "::warning title=Nothing to compare::No passing preview smoke run of ${develop:0:7} (the release's develop commit) was found, so production is smoke-tested without comparing screenshots. A hotfix released straight from main has none."
            exit 0
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Comparing with the preview's screenshots from run $run, of ${develop::7}."
      - if: steps.baseline.outputs.run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-screenshots
          path: smoke-screenshots
          run-id: ${{ steps.baseline.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - name: Smoke-test production
        env:
          SMOKE_URL: https://lede.cloudcompute.com
          SMOKE_ENTRY: ${{ needs.deploy.outputs.entry }}
          SMOKE_REGISTRY_SHA256: ${{ needs.deploy.outputs.registry }}
          SMOKE_LLMS_SHA256: ${{ needs.deploy.outputs.llms }}
          SMOKE_SCREENSHOTS: ${{ steps.baseline.outputs.run && 'compare' || '' }}
        run: npx playwright test -c playwright.smoke.config.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results
          path: test-results
          retention-days: 30
