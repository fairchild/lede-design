name: Tag the release
# When main gets a version that has no tag yet, which happens when the release pull request (develop → main) merges,
# this tags main's commit `v<version>` once CI's `check` has passed on it. The tag runs Deploy and the mirror, as a tag
# pushed by hand does. A push to main whose version is already tagged does nothing.
#
# The tag ruleset lets only admins create tags, so the tag comes from the release GitHub App, which is on the ruleset's
# bypass list. A tag made with the workflow's own token wouldn't run Deploy either. Without the app this run says so
# and stops, and the tag is pushed by hand as docs/releasing.md says.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: read
concurrency:
  group: release-tag
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, persist-credentials: false }
      - name: Decide whether this commit is a release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version package.json)
          tag="v$version"
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            echo "::notice title=Already tagged::$tag is on ${existing::7}, so this commit isn't a new release."
            exit 0
          fi
          final='^v[0-9]+\.[0-9]+\.[0-9]+$'
          latest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' |
            sed 's#^refs/tags/##' | { grep -E "$final" || true; } | sort -V | tail -n 1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$tag" | sort -V | tail -n 1)" != "$tag" ]; then
            echo "::error::package.json says $version, which is below the latest release, $latest. Nothing was tagged."
            exit 1
          fi
          # A release pull request merges with a merge commit, so develop and main keep one history.
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -lt 3 ]; then
            echo "::warning title=Not a merge commit::${GITHUB_SHA::7} has one parent, so the release was probably squashed. Merge main back into develop after the release."
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Check for the release app
        id: app
        if: steps.plan.outputs.tag
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Tag it by hand::The release app isn't set up (RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY), so $TAG wasn't created. Push it as docs/releasing.md says."
          fi
      # A release is immutable once Deploy publishes it, so only a commit whose `check` passed gets the tag. A failed
      # check leaves main untagged; the fix's own merge into main is tagged instead. Same wait as Deploy's.
      - name: Wait for CI to pass
        if: steps.app.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          for _ in $(seq 90); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=check&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | max_by(.started_at) // {} | "\(.status // "missing") \(.conclusion // "")"')
            read -r status conclusion <<< "$run"
            if [ "$status" = completed ]; then
              [ "$conclusion" = success ] && exit 0
              echo "::error::CI's check on ${GITHUB_SHA::7} finished as $conclusion, so $TAG wasn't created. Fix it on develop and release again."
              exit 1
            fi
            sleep 30
          done
          echo "::error::CI's check on ${GITHUB_SHA::7} is ${status/missing/not there}, so $TAG wasn't created. Run this workflow again once it passes."
          exit 1
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: token
        if: steps.app.outputs.ready == 'true'
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Create the tag
        if: steps.app.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" > /dev/null
          echo "### Tagged $TAG on ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy and the mirror run from the tag." >> "$GITHUB_STEP_SUMMARY"
