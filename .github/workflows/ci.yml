name: CI
# A pull request into main runs what its change can affect, and `check` reports the result. A PR into another branch,
# a push to main and a manual run all run everything. `plan` sorts a PR into main by its diff with scripts/ci-tier.mjs:
# 1, Markdown the site doesn't render and integrations/: the build only.
# 2, test files only: the build, and beside it the changed specs and the specs that import a changed helper.
# 3, anything else: the build, and beside it the whole suite in shards, with perf alone on its own runner.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# A new push replaces a PR's run. Main and manual runs each get a group of their own, so none is ever cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# An explicit bash runs every step with -eo pipefail, so a failed git diff fails the plan.
defaults:
  run:
    shell: bash
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.plan.outputs.tier }}
      base: ${{ steps.plan.outputs.base }}
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      # A PR checks out its merge commit: the first parent is the base, and the second is the PR's head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, persist-credentials: false }
      - run: node scripts/ci-tier.mjs --self-test
      - name: Classify the change
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          tier=3 base='' shards=4
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
            git diff --name-only --no-renames HEAD^1 HEAD | tee changed.txt
            tier=$(node scripts/ci-tier.mjs "$BASE_REF" < changed.txt)
          fi
          if [ "$tier" = 2 ]; then base=$(git rev-parse HEAD^1) shards=1; fi
          parts=$(jq -nc --argjson n "$shards" '[range(1; $n + 1) | "\(.)/\($n)"] + ["perf"]')
          printf 'tier=%s\nbase=%s\nparts=%s\n' "$tier" "$base" "$parts" | tee -a "$GITHUB_OUTPUT"
          case $tier in
            1) what='Markdown or integrations only: the build and no Playwright.' ;;
            2) what='Tests only: the build and the changed specs.' ;;
            *) what='The build and the whole suite.' ;;
          esac
          echo "::notice title=Tier $tier::$what"

  # The gates, the typecheck and the site, as `npm run build` runs them locally.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build          # tokens → registry (public/r) → typecheck → site

  # Each entry in integrations/ reads Lede's source from registry/, so every PR builds and tests each one, with its own
  # install. The tokens script it runs needs no root install.
  integrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: [json-render]
    defaults:
      run:
        working-directory: integrations/${{ matrix.entry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm, cache-dependency-path: 'integrations/${{ matrix.entry }}/package-lock.json' }
      - run: npm ci
      - run: npm run build          # tokens → tsc --noEmit, with the catalog fit check → vite build
      - run: npm test               # renders each recorded spec and checks its types and props

  # Each part has a runner of its own: a shard of desktop and phone, or perf, which measures timings and so runs alone.
  # Tier 2 has one shard, and both parts keep to the changed specs.
  test:
    name: test (${{ matrix.part }})
    needs: plan
    if: needs.plan.outputs.tier != '1'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 2, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run registry       # the tests read its output: the generated tokens CSS and public/r
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - name: Playwright           # axe in four themes on every route, plus behavior checks
        env:
          PART: ${{ matrix.part }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          if [ "$PART" = perf ]; then
            npx playwright test --project=perf --no-deps ${BASE:+"--only-changed=$BASE"}
          else
            npx playwright test --project=desktop --project=phone --project=strict-desktop --project=strict-phone --shard="$PART" ${BASE:+"--only-changed=$BASE"}
          fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-${{ strategy.job-index }}
          path: blob-report
          retention-days: 1

  # One report from every part, with the counts per project in the run's summary. It's attached when a test fails.
  report:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # This lists blobs with `latest: true`, which avoids duplicates across re-runs. If a re-run's summary is
      # missing a shard, re-run all jobs; `check` reads job results, so it's unaffected either way. Blobs keep for a day,
      # so a re-run after that needs "Re-run all jobs".
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: blob-*, merge-multiple: true, path: blob-reports }
      - env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: results.json
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright merge-reports --reporter=html,json blob-reports
      - run: |
          jq -r '
            [.. | objects | select(has("projectName") and has("status"))] as $tests
            | "| Project | Passed | Skipped | Flaky | Failed |", "| --- | --: | --: | --: | --: |",
              ($tests | group_by(.projectName)[]
                | [.[0].projectName, (("expected", "skipped", "flaky", "unexpected") as $s | map(select(.status == $s)) | length)]
                | "| \(join(" | ")) |"),
              "",
              "\(.stats.expected) passed, \(.stats.skipped) skipped, \(.stats.flaky) flaky, \(.stats.unexpected) failed",
              (.. | objects | select(has("specs")) | .specs[] as $spec | $spec.tests[] | select(.status == "unexpected")
                | "- Failed: \(.projectName) › \($spec.file):\($spec.line) › \($spec.title)")
          ' results.json | tee -a "$GITHUB_STEP_SUMMARY"
      - if: needs.test.result == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-report, path: playwright-report }

  # The one status a merge reads. Tier 1 skips test and report, and every other job has to succeed.
  check:
    if: always()
    needs: [plan, build, integrations, test, report]
    runs-on: ubuntu-latest
    steps:
      # 5 is the length of `needs:` above, so a job dropped from that list fails here. Change both together.
      - env:
          TIER: ${{ needs.plan.outputs.tier }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e --arg tier "$TIER" 'length == 5 and (to_entries | all(.value.result == "success"
            or ($tier == "1" and (.key == "test" or .key == "report") and .value.result == "skipped")))' <<< "$NEEDS" >/dev/null
