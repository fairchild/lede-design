# The opt-in workflow the gondolin-ci skill dispatches: CI for one pull request, one suite at a time, on a single-use
# micro-VM on the owner's laptop. It exists while GitHub-hosted runners are unavailable, and runs what ci.yml runs.
#
# Nothing about a pull request starts a run: there is no pull_request or push trigger, label or path filter. A run
# exists because someone with write access dispatched one, naming the commit they read. The skill dispatches on the
# default branch, so the definition that executes is main's copy of this file, and the pull request's code is checked
# out as data. A dispatch at any other ref runs that ref's copy, which is why each job sends such a run to a hosted
# runner.
#
# The run does not attach its checks to the pull request. It is read on its own.
#
# The guest is arm64 Linux with 4 CPUs that yield to whoever is using the laptop, so each suite is sized to finish
# well inside its timeout at about half of a hosted runner's speed, and every timeout stays under the hour after
# which the skill stops following a run. Setup actions' caches stay off: a run on the default branch writes to the
# cache later jobs restore from (the skill's design, gap 2). The job's user has no root, and the guest image carries
# Chromium's system libraries, so Playwright installs the browser without --with-deps.
name: Opt-in PR Run

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number an opt-in runner is registered for
        required: true
        type: string
      head_sha:
        description: The 40-character commit that was read; the job refuses any other
        required: true
        type: string
      suites:
        description: Comma-separated subset of the jobs below
        required: false
        type: string
        default: build

permissions:
  contents: read

# One runner serves one job, so a second dispatch for a pull request would queue for hours.
concurrency:
  group: optin-pr-${{ inputs.pull_request }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The gates, the typecheck and the site, as `npm run build` runs them locally, and ci-tier's own cases.
  build:
    if: contains(format(',{0},', inputs.suites), ',build,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","optin","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.head_sha }}", persist-credentials: false }
      - name: Confirm the tree is the commit that was read
        env: { HEAD_SHA: "${{ inputs.head_sha }}" }
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, package-manager-cache: false }
      - run: node scripts/ci-tier.mjs --self-test
      - run: npm ci
      - run: npm run build          # tokens → registry (public/r) → typecheck → site

  # The Playwright suite in five shards of desktop, phone and the strict projects. ci.yml uses four on hosted runners;
  # the fifth keeps each shard well inside its timeout in the slower guest.
  test-1:
    if: contains(format(',{0},', inputs.suites), ',test-1,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","optin","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 50
    env: { SHARD: 1/5 }
    steps: &playwright
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.head_sha }}", persist-credentials: false }
      - name: Confirm the tree is the commit that was read
        env: { HEAD_SHA: "${{ inputs.head_sha }}" }
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, package-manager-cache: false }
      - run: npm ci
      - run: npm run registry       # the tests read its output: the generated tokens CSS and public/r
      - run: npx playwright install chromium
      - name: Playwright           # axe in four themes on every route, plus behavior checks
        run: |
          if [ "$SHARD" = perf ]; then
            npx playwright test --project=perf --no-deps --reporter=list
          else
            npx playwright test --project=desktop --project=phone --project=strict-desktop --project=strict-phone --shard="$SHARD" --reporter=list
          fi

  test-2:
    if: contains(format(',{0},', inputs.suites), ',test-2,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","optin","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 50
    env: { SHARD: 2/5 }
    steps: *playwright

  test-3:
    if: contains(format(',{0},', inputs.suites), ',test-3,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","optin","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 50
    env: { SHARD: 3/5 }
    steps: *playwright

  test-4:
    if: contains(format(',{0},', inputs.suites), ',test-4,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","optin","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 50
    env: { SHARD: 4/5 }
    steps: *playwright

  test-5:
    if: contains(format(',{0},', inputs.suites), ',test-5,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","optin","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 50
    env: { SHARD: 5/5 }
    steps: *playwright

  # The performance budget compares timings, so it runs alone. A guest sharing the laptop measures slower than a hosted
  # runner, so a failure here is read against the host's load before the code.
  perf:
    if: contains(format(',{0},', inputs.suites), ',perf,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","optin","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 30
    env: { SHARD: perf }
    steps: *playwright

  # Each entry in integrations/ builds and runs its own tests against Lede's source in registry/. A commit without the
  # entry passes with a notice, so these suites can run on branches that predate integrations/.
  integration-json-render:
    if: contains(format(',{0},', inputs.suites), ',integration-json-render,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","optin","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 30
    env: { ENTRY: json-render }
    steps: &integration
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.head_sha }}", persist-credentials: false }
      - name: Confirm the tree is the commit that was read
        env: { HEAD_SHA: "${{ inputs.head_sha }}" }
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Find the entry
        id: entry
        run: |
          if [ -f "integrations/$ENTRY/package.json" ]; then
            echo present=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No integrations/$ENTRY::This commit has no integrations/$ENTRY, so there is nothing to test."
          fi
      - if: steps.entry.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, package-manager-cache: false }
      - if: steps.entry.outputs.present == 'true'
        working-directory: integrations/${{ env.ENTRY }}
        run: npm ci
      - if: steps.entry.outputs.present == 'true'
        working-directory: integrations/${{ env.ENTRY }}
        run: npm run build          # tokens → tsc --noEmit → vite build
      - if: steps.entry.outputs.present == 'true' && hashFiles(format('integrations/{0}/playwright.config.ts', env.ENTRY)) != ''
        working-directory: integrations/${{ env.ENTRY }}
        run: npx playwright install chromium
      - if: steps.entry.outputs.present == 'true'
        working-directory: integrations/${{ env.ENTRY }}
        run: npm test               # each entry's own tests, such as its specs against the catalog

  integration-json-render-chat:
    if: contains(format(',{0},', inputs.suites), ',integration-json-render-chat,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","optin","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 30
    env: { ENTRY: json-render-chat }
    steps: *integration
