name: Deploy develop to the preview site
# Each push to develop builds the site and deploys it as its own Worker, on the custom domain the repo variable
# PREVIEW_HOST names (lede-preview.cloudcompute.com today), so the next release can be read before it ships. Without
# the variable the job doesn't run. Production, r/next and the release registries are deploy.yml's alone: the Worker's
# code only reads the bucket, and this workflow holds no R2 keys.
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
# Only develop's newest commit is worth showing, so a newer push replaces a run that hasn't finished.
concurrency:
  group: deploy-preview
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  deploy:
    # A job-level skip, so a repo without the variable never asks the environment for its secrets.
    if: vars.PREVIEW_HOST != '' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    # Its own environment, admitting only develop, with a Cloudflare token of its own and no R2 keys, so nothing pushed to
    # develop can publish a registry or touch production's credentials (docs/repo-settings.md).
    environment:
      name: preview
      url: https://${{ vars.PREVIEW_HOST }}
    # What smoke checks the live site against. `deployed` stays empty when the token is missing, so smoke is skipped
    # and Approve the release, which needs smoke to have passed, doesn't count a run that deployed nothing.
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      entry: ${{ steps.built.outputs.entry }}
      registry: ${{ steps.built.outputs.registry }}
      llms: ${{ steps.built.outputs.llms }}
    steps:
      - name: Check for a Cloudflare token
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Preview skipped::CLOUDFLARE_API_TOKEN isn't set, so the preview wasn't deployed."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.ready == 'true'
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.credentials.outputs.ready == 'true'
        with: { node-version: 22, cache: npm }
      - if: steps.credentials.outputs.ready == 'true'
        run: npm ci
      - if: steps.credentials.outputs.ready == 'true'
        run: npm run build
      - name: Record what this build serves
        id: built
        if: steps.credentials.outputs.ready == 'true'
        run: bash smoke/build-facts.sh | tee -a "$GITHUB_OUTPUT"
      # The Worker is wrangler.jsonc's under another name, so the production Worker and its versions are never touched.
      # --domain attaches PREVIEW_HOST as a custom domain, which needs its zone in the same Cloudflare account.
      - name: Deploy the preview Worker
        id: deploy
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
        run: |
          npx wrangler deploy --name lede-design-preview --domain "$PREVIEW_HOST" \
            --message "develop ${GITHUB_SHA::7}"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview of develop at ${GITHUB_SHA::7}"
            echo
            echo "https://$PREVIEW_HOST/"
          } >> "$GITHUB_STEP_SUMMARY"

  # The deploy checks it could write and upload; this reads the site back, as a browser and a fetcher do, once it
  # serves the build above: key pages render without errors, every registry item and the llms files are there, and
  # the Worker's 404s and Markdown answers hold (smoke/). It also records screenshots of key pages, which Deploy's
  # production smoke test compares against once this commit is released. Approve the release waits for this job, by
  # its name, to pass on the release's commit. It needs no secrets, so "Re-run failed jobs" retries it without
  # deploying again.
  smoke:
    name: Smoke-test the preview
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - name: Smoke-test the preview
        env:
          SMOKE_URL: https://${{ vars.PREVIEW_HOST }}
          SMOKE_ENTRY: ${{ needs.deploy.outputs.entry }}
          SMOKE_REGISTRY_SHA256: ${{ needs.deploy.outputs.registry }}
          SMOKE_LLMS_SHA256: ${{ needs.deploy.outputs.llms }}
          SMOKE_SCREENSHOTS: record
        run: npx playwright test -c playwright.smoke.config.ts
      # Deploy finds these by this name on the run for the commit it releases; 90 days covers a slow release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-screenshots
          path: smoke-screenshots
          retention-days: 90
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-results
          path: test-results
          retention-days: 14
