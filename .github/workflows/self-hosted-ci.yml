# CI for one pull request on a runner you host, for when GitHub-hosted runners are unavailable. It runs what ci.yml
# runs. docs/self-hosted-ci.md is the contract a person or an agent follows to serve it.
#
# Nothing about a pull request starts a run: there is no pull_request or push trigger. Someone with write access
# dispatches it on the default branch, naming the commit they read, and the job refuses any other. The definition
# that executes is the default branch's copy of this file, and the pull request's code is checked out as data. A
# dispatch at any other ref runs on a GitHub-hosted runner.
#
# Each job asks for a runner labelled self-hosted and pr-<number>, so a runner registered for one pull request takes
# only that pull request's jobs. The run attaches no checks to the pull request; read it on its own.
#
# Timeouts assume a runner at about half a hosted runner's speed. Setup caches stay off, because a run on the default
# branch writes the cache that later runs restore. Playwright installs Chromium without --with-deps, so the runner
# needs Chromium's system libraries and no root.
name: Self-hosted CI

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: The pull request whose runner, labelled pr-<number>, takes the jobs
        required: true
        type: string
      head_sha:
        description: The 40-character commit that was read; the job refuses any other
        required: true
        type: string
      suites:
        description: Comma-separated jobs to run. full runs everything on one runner; the others are for reruns
        required: false
        type: string
        default: full

permissions:
  contents: read

# One runner serves one job, so a second dispatch for a pull request would queue for hours.
concurrency:
  group: self-hosted-pr-${{ inputs.pull_request }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Everything below in one job, so one runner covers the pull request: one checkout and one npm ci, then the build,
  # the Playwright suite, perf and each integration. A later step still runs after an earlier one fails, so one run
  # reports every suite. The Playwright web servers build their own copies, because those have the /fixtures/* pages
  # and the strict one has React's development build; `npm run build`'s dist/ has neither.
  full:
    if: contains(format(',{0},', inputs.suites), ',full,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.head_sha }}", persist-credentials: false }
      - name: Confirm the tree is the commit that was read
        env: { HEAD_SHA: "${{ inputs.head_sha }}" }
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, package-manager-cache: false }
      - run: node scripts/ci-tier.mjs --self-test
      - id: install
        run: npm ci
      - id: build
        run: npm run build          # tokens → registry (public/r) → typecheck → site; the tests read the first two
      - id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx playwright install chromium
      - name: Playwright           # desktop, phone and strict-desktop
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npx playwright test --project=desktop --project=phone --project=strict-desktop --reporter=list
      - name: Performance budget   # alone, after the suite, with nothing else on the runner
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: npx playwright test --project=perf --no-deps --reporter=list
      - name: Integrations         # each entry in integrations/ builds and runs its own tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          shopt -s nullglob
          entries=(integrations/*/package.json)
          if [ ${#entries[@]} -eq 0 ]; then
            echo "::notice title=No integrations::This commit has no integrations/, so there is nothing to test."
          fi
          for manifest in "${entries[@]}"; do
            dir=${manifest%/package.json}
            echo "::group::$dir"
            (
              cd "$dir"
              npm ci
              npm run build
              if [ -f playwright.config.ts ]; then npx playwright install chromium; fi
              npm test
            )
            echo "::endgroup::"
          done

  # The gates, the typecheck and the site, as `npm run build` runs them locally, and ci-tier's own cases.
  build:
    if: contains(format(',{0},', inputs.suites), ',build,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.head_sha }}", persist-credentials: false }
      - name: Confirm the tree is the commit that was read
        env: { HEAD_SHA: "${{ inputs.head_sha }}" }
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, package-manager-cache: false }
      - run: node scripts/ci-tier.mjs --self-test
      - run: npm ci
      - run: npm run build          # tokens → registry (public/r) → typecheck → site

  # The Playwright suite in five shards of desktop, phone and strict-desktop, for rerunning one part of a full run.
  # ci.yml uses four on hosted runners; the fifth keeps each shard well inside its timeout on a slower runner.
  test-1:
    if: contains(format(',{0},', inputs.suites), ',test-1,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 50
    env: { SHARD: 1/5 }
    steps: &playwright
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.head_sha }}", persist-credentials: false }
      - name: Confirm the tree is the commit that was read
        env: { HEAD_SHA: "${{ inputs.head_sha }}" }
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, package-manager-cache: false }
      - run: npm ci
      - run: npm run registry       # the tests read its output: the generated tokens CSS and public/r
      - run: npx playwright install chromium
      - name: Playwright           # axe on every route, plus behavior checks
        run: |
          if [ "$SHARD" = perf ]; then
            npx playwright test --project=perf --no-deps --reporter=list
          else
            npx playwright test --project=desktop --project=phone --project=strict-desktop --shard="$SHARD" --reporter=list
          fi

  test-2:
    if: contains(format(',{0},', inputs.suites), ',test-2,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 50
    env: { SHARD: 2/5 }
    steps: *playwright

  test-3:
    if: contains(format(',{0},', inputs.suites), ',test-3,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 50
    env: { SHARD: 3/5 }
    steps: *playwright

  test-4:
    if: contains(format(',{0},', inputs.suites), ',test-4,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 50
    env: { SHARD: 4/5 }
    steps: *playwright

  test-5:
    if: contains(format(',{0},', inputs.suites), ',test-5,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 50
    env: { SHARD: 5/5 }
    steps: *playwright

  # The performance budget compares timings, so it runs alone. A runner on a busy machine measures slower than a hosted
  # one, so a failure here is read against the machine's load before the code.
  perf:
    if: contains(format(',{0},', inputs.suites), ',perf,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 30
    env: { SHARD: perf }
    steps: *playwright

  # Each entry in integrations/ builds and runs its own tests against Lede's source in registry/. A commit without the
  # entry passes with a notice, so these suites can run on branches that predate integrations/.
  integration-json-render:
    if: contains(format(',{0},', inputs.suites), ',integration-json-render,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 30
    env: { ENTRY: json-render }
    steps: &integration
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.head_sha }}", persist-credentials: false }
      - name: Confirm the tree is the commit that was read
        env: { HEAD_SHA: "${{ inputs.head_sha }}" }
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Find the entry
        id: entry
        run: |
          if [ -f "integrations/$ENTRY/package.json" ]; then
            echo present=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=No integrations/$ENTRY::This commit has no integrations/$ENTRY, so there is nothing to test."
          fi
      - if: steps.entry.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, package-manager-cache: false }
      - if: steps.entry.outputs.present == 'true'
        working-directory: integrations/${{ env.ENTRY }}
        run: npm ci
      - if: steps.entry.outputs.present == 'true'
        working-directory: integrations/${{ env.ENTRY }}
        run: npm run build          # tokens → tsc --noEmit → vite build
      - if: steps.entry.outputs.present == 'true' && hashFiles(format('integrations/{0}/playwright.config.ts', env.ENTRY)) != ''
        working-directory: integrations/${{ env.ENTRY }}
        run: npx playwright install chromium
      - if: steps.entry.outputs.present == 'true'
        working-directory: integrations/${{ env.ENTRY }}
        run: npm test               # each entry's own tests, such as its specs against the catalog

  integration-json-render-chat:
    if: contains(format(',{0},', inputs.suites), ',integration-json-render-chat,')
    runs-on: >-
      ${{ github.event_name == 'workflow_dispatch'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && fromJSON(format('["self-hosted","pr-{0}"]', inputs.pull_request))
      || 'ubuntu-latest' }}
    timeout-minutes: 30
    env: { ENTRY: json-render-chat }
    steps: *integration
